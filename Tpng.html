<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent PNG Generator</title>
    <style>
        :root {
            --background-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --border-color: #ddd;
            --shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--container-bg);
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            font-weight: 600;
        }
        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            width: 100%;
            text-align: left;
        }
        .input-field label {
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .input-field input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .input-field input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }
        .presets {
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }
        .preset-btn {
            background-color: #e9ecef;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .preset-btn:hover {
            background-color: #d8dde2;
        }
        .preview-area {
            background-image:
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            height: 150px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .preview-box {
            background: rgba(0, 123, 255, 0.1);
            border: 2px solid var(--primary-color);
            box-sizing: border-box;
            max-width: 100%;
            max-height: 100%;
        }
        .dimensions-display {
            position: absolute;
            bottom: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .download-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .download-btn:hover, .download-btn:focus {
            background-color: var(--primary-hover);
            outline: none;
        }
        .download-btn:disabled {
             background-color: #a0c9ff;
             cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Transparent PNG Generator</h1>

        <div class="input-group">
            <div class="input-field">
                <label for="width">Width (px)</label>
                <input type="number" id="width" value="1920" min="1" step="1">
            </div>
            <div class="input-field">
                <label for="height">Height (px)</label>
                <input type="number" id="height" value="1080" min="1" step="1">
            </div>
        </div>

        <div class="presets">
            <button class="preset-btn" data-width="1920" data-height="1080">16:9</button>
            <button class="preset-btn" data-width="1280" data-height="720">16:9 (HD)</button>
            <button class="preset-btn" data-width="1024" data-height="768">4:3</button>
            <button class="preset-btn" data-width="1080" data-height="1080">1:1 (Square)</button>
            <button class="preset-btn" data-width="1080" data-height="1920">9:16 (Story)</button>
        </div>

        <div class="preview-area" id="previewArea">
            <div class="preview-box" id="previewBox"></div>
            <span class="dimensions-display" id="dimensionsDisplay">1920 x 1080</span>
        </div>

        <button class="download-btn" id="downloadBtn">Download PNG</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const widthInput = document.getElementById('width');
            const heightInput = document.getElementById('height');
            const downloadBtn = document.getElementById('downloadBtn');
            const previewArea = document.getElementById('previewArea');
            const previewBox = document.getElementById('previewBox');
            const dimensionsDisplay = document.getElementById('dimensionsDisplay');
            const presetBtns = document.querySelectorAll('.preset-btn');

            const updatePreview = () => {
                const width = parseInt(widthInput.value, 10);
                const height = parseInt(heightInput.value, 10);

                // Validate input
                const isValid = width > 0 && height > 0;
                downloadBtn.disabled = !isValid;

                if (!isValid) {
                    dimensionsDisplay.textContent = 'Invalid dimensions';
                    previewBox.style.width = '0px';
                    previewBox.style.height = '0px';
                    return;
                }

                dimensionsDisplay.textContent = `${width} x ${height}`;

                // Update preview box aspect ratio
                const previewAreaWidth = previewArea.clientWidth;
                const previewAreaHeight = previewArea.clientHeight;
                const aspectRatio = width / height;

                let previewWidth = previewAreaWidth;
                let previewHeight = previewWidth / aspectRatio;

                if (previewHeight > previewAreaHeight) {
                    previewHeight = previewAreaHeight;
                    previewWidth = previewHeight * aspectRatio;
                }

                previewBox.style.width = `${previewWidth}px`;
                previewBox.style.height = `${previewHeight}px`;
            };

            const downloadImage = () => {
                const width = parseInt(widthInput.value, 10);
                const height = parseInt(heightInput.value, 10);

                if (width <= 0 || height <= 0 || isNaN(width) || isNaN(height)) {
                    alert('Please enter valid positive numbers for width and height.');
                    return;
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;

                // The canvas is transparent by default, so no drawing is needed.
                // const ctx = canvas.getContext('2d');
                // ctx.clearRect(0, 0, width, height);

                const dataURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = `transparent_${width}x${height}.png`;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // Event Listeners
            widthInput.addEventListener('input', updatePreview);
            heightInput.addEventListener('input', updatePreview);
            downloadBtn.addEventListener('click', downloadImage);

            presetBtns.forEach(button => {
                button.addEventListener('click', () => {
                    widthInput.value = button.dataset.width;
                    heightInput.value = button.dataset.height;
                    updatePreview();
                });
            });

            // Initial setup
            updatePreview();
            
            // Re-calculate on window resize
            window.addEventListener('resize', updatePreview);
        });
    </script>
</body>
</html>
